# VPS deployment example: /etc/nginx/conf.d/restaurant.conf
# After certbot, HTTPS block will be generated by certbot --nginx.

server {
    listen 80;
    server_name dashboard.example.com;

    # Optional nginx-level password (alternatively use app auth or Cloudflare Access):
    # auth_basic "Restaurant Monitoring";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws {
        proxy_pass http://127.0.0.1:8000/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /video_feed {
        proxy_pass http://127.0.0.1:8000/video_feed;
        proxy_buffering off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
